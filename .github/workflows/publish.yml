name: Publish to PyPI

on:
  release:
    types: [published]

# Trusted Publishing: no API token stored anywhere. Link this workflow once on
# PyPI (project "subcortex" -> Publishing -> GitHub: pavlealeksic/subcortex,
# workflow "publish.yml", environment "pypi").
permissions:
  id-token: write
  contents: read   # needed to check out private repos

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
